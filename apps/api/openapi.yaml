openapi: 3.0.3
info:
  title: Daycare Scheduler API
  version: 0.1.0
servers:
  - url: /
paths:
  /api/health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/settings/{schoolId}:
    get:
      summary: Get settings for a school
      parameters:
        - in: path
          name: schoolId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Settings payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
    put:
      summary: Save settings for a school
      parameters:
        - in: path
          name: schoolId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsPayload'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsSaveResponse'
  /api/schedule/{weekId}:
    get:
      summary: Get schedule week
      parameters:
        - in: path
          name: weekId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Schedule week
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleWeekResponse'
    put:
      summary: Save schedule week
      parameters:
        - in: path
          name: weekId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleSavePayload'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericOk'
components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
      required: [status]
    DayOfWeek:
      type: string
      enum: [mon, tue, wed, thu, fri, sat, sun]
    DaySegment:
      type: string
      enum: [open, mid, close]
    ScheduleStatus:
      type: string
      enum: [draft, ready_for_review, submitted, approved, archived]
    DayScheduleType:
      type: string
      enum: [closed, in_house, full_day, school_day]
    AssignmentSource:
      type: string
      enum: [template, manual_adjustment, field_trip_override, import]
    EnrollmentSource:
      type: string
      enum: [roster, manual_adjustment, override]
    EmploymentStatus:
      type: string
      enum: [active, on_leave, archived]
    SchoolSettings:
      type: object
      properties:
        name:
          type: string
        closedDays:
          type: array
          items:
            $ref: '#/components/schemas/DayOfWeek'
        openerCount:
          type: integer
        closerCount:
          type: integer
        minimumMedicalDelegated:
          type: integer
        requireCurrentCpr:
          type: boolean
      required:
        - name
        - closedDays
        - openerCount
        - closerCount
        - minimumMedicalDelegated
        - requireCurrentCpr
    SchoolRecord:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        closedDays:
          type: array
          items:
            type: string
        openerCount:
          type: integer
        closerCount:
          type: integer
        minimumMedicalDelegated:
          type: integer
        requireCurrentCpr:
          type: boolean
      required:
        - id
        - name
        - closedDays
        - openerCount
        - closerCount
        - minimumMedicalDelegated
        - requireCurrentCpr
    ScheduleTypePayload:
      type: object
      properties:
        value:
          type: string
        label:
          type: string
        ratio:
          type: object
          properties:
            adults:
              type: integer
            students:
              type: integer
          required: [adults, students]
        description:
          type: string
      required: [value, label, ratio]
    ScheduleTypeResponse:
      type: object
      properties:
        id:
          type: string
        schoolId:
          type: string
        value:
          type: string
        label:
          type: string
        ratioAdults:
          type: integer
        ratioStudents:
          type: integer
        description:
          type: string
      required: [id, schoolId, value, label, ratioAdults, ratioStudents]
    JobTitlePayload:
      type: object
      properties:
        title:
          type: string
        leaderQualified:
          type: boolean
        requiresLeaderForOpenClose:
          type: boolean
      required: [title, leaderQualified, requiresLeaderForOpenClose]
    JobTitleResponse:
      type: object
      properties:
        id:
          type: string
        schoolId:
          type: string
        title:
          type: string
        leaderQualified:
          type: boolean
        requiresLeaderForOpenClose:
          type: boolean
      required: [id, schoolId, title, leaderQualified, requiresLeaderForOpenClose]
    EmployeePayload:
      type: object
      properties:
        name:
          type: string
        jobTitle:
          type: string
        maxHoursPerDay:
          type: integer
        maxHoursPerWeek:
          type: integer
        employmentStatus:
          $ref: '#/components/schemas/EmploymentStatus'
        medicallyDelegated:
          type: boolean
        cprCurrent:
          type: boolean
        notes:
          type: string
        availability:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeAvailabilityDay'
        requestedDaysOff:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeTimeOffRequest'
      required:
        - name
        - jobTitle
        - maxHoursPerDay
        - maxHoursPerWeek
        - employmentStatus
        - medicallyDelegated
        - cprCurrent
    EmployeeResponse:
      type: object
      properties:
        id:
          type: string
        schoolId:
          type: string
        name:
          type: string
        jobTitle:
          type: string
        maxHoursPerDay:
          type: integer
        maxHoursPerWeek:
          type: integer
        employmentStatus:
          type: string
        medicallyDelegated:
          type: boolean
        cprCurrent:
          type: boolean
        notes:
          type: string
        availability:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeAvailabilityDay'
        requestedDaysOff:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeTimeOffRequest'
      required:
        - id
        - schoolId
        - name
        - jobTitle
        - maxHoursPerDay
        - maxHoursPerWeek
        - employmentStatus
        - medicallyDelegated
        - cprCurrent
    EmployeeAvailabilityBlock:
      type: object
      properties:
        startTime:
          type: string
        endTime:
          type: string
      required: [startTime, endTime]
    EmployeeAvailabilityDay:
      type: object
      properties:
        dayOfWeek:
          $ref: '#/components/schemas/DayOfWeek'
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeAvailabilityBlock'
      required: [dayOfWeek, blocks]
    EmployeeTimeOffRequest:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
        note:
          type: string
      required: [id, date]
    OperatingHoursPayload:
      type: object
      properties:
        scheduleType:
          type: string
        daysOfWeek:
          type: array
          items:
            $ref: '#/components/schemas/DayOfWeek'
        open:
          type: string
        close:
          type: string
      required: [scheduleType, daysOfWeek, open, close]
    OperatingHoursResponse:
      type: object
      properties:
        id:
          type: string
        schoolId:
          type: string
        scheduleType:
          type: string
        daysOfWeek:
          type: array
          items:
            type: string
        open:
          type: string
        close:
          type: string
      required: [id, schoolId, scheduleType, daysOfWeek, open, close]
    FieldTripTypePayload:
      type: object
      properties:
        name:
          type: string
        minAdultStudentRatio:
          type: number
        minLeaderStudentRatio:
          type: number
        policyCitationId:
          type: string
        notes:
          type: string
      required: [name, minAdultStudentRatio, minLeaderStudentRatio]
    FieldTripTypeResponse:
      type: object
      properties:
        id:
          type: string
        schoolId:
          type: string
        name:
          type: string
        minAdultStudentRatio:
          type: number
        minLeaderStudentRatio:
          type: number
        policyCitationId:
          type: string
        notes:
          type: string
      required: [id, schoolId, name, minAdultStudentRatio, minLeaderStudentRatio]
    ScheduleWeek:
      type: object
      properties:
        id:
          type: string
        schoolId:
          type: string
        label:
          type: string
        status:
          $ref: '#/components/schemas/ScheduleStatus'
        startDate:
          type: string
      required: [id, schoolId, status]
    ScheduleDay:
      type: object
      properties:
        id:
          type: string
        scheduleWeekId:
          type: string
        date:
          type: string
        dayOfWeek:
          $ref: '#/components/schemas/DayOfWeek'
        scheduleType:
          type: string
        enrollmentCount:
          type: integer
        enrollmentSource:
          $ref: '#/components/schemas/EnrollmentSource'
        fieldTripEventId:
          type: string
        operatingCapacityOverride:
          type: integer
        notes:
          type: string
        dayScheduleType:
          $ref: '#/components/schemas/DayScheduleType'
      required: [id, scheduleWeekId, date, dayOfWeek]
    SegmentBlock:
      type: object
      properties:
        id:
          type: string
        scheduleWeekId:
          type: string
        scheduleDayId:
          type: string
        dayOfWeek:
          $ref: '#/components/schemas/DayOfWeek'
        segment:
          $ref: '#/components/schemas/DaySegment'
        startTime:
          type: string
        endTime:
          type: string
        childCount:
          type: integer
        fieldTripEventId:
          type: string
        status:
          $ref: '#/components/schemas/ScheduleStatus'
        operatingCapacityOverride:
          type: integer
        closedReason:
          type: string
      required: [id, scheduleWeekId, dayOfWeek, segment, startTime, endTime, childCount, status]
    StaffAssignment:
      type: object
      properties:
        id:
          type: string
        segmentBlockId:
          type: string
        employeeId:
          type: string
        assignmentSource:
          $ref: '#/components/schemas/AssignmentSource'
        startTime:
          type: string
        endTime:
          type: string
        status:
          type: string
          enum: [scheduled, active, on_break, completed]
        notes:
          type: string
      required: [id, segmentBlockId, employeeId, assignmentSource, startTime, endTime, status]
    FieldTripEvent:
      type: object
      properties:
        id:
          type: string
        scheduleWeekId:
          type: string
        dayOfWeek:
          $ref: '#/components/schemas/DayOfWeek'
        segment:
          $ref: '#/components/schemas/DaySegment'
        scheduleDayId:
          type: string
        fieldTripTypeId:
          type: string
        isNoFieldTrip:
          type: boolean
        approverId:
          type: string
        signedOffAt:
          type: string
        policyCitationId:
          type: string
        notes:
          type: string
      required: [id, scheduleWeekId, dayOfWeek, segment]
    SettingsPayload:
      type: object
      properties:
        school:
          $ref: '#/components/schemas/SchoolSettings'
        scheduleTypes:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleTypePayload'
        jobTitles:
          type: array
          items:
            $ref: '#/components/schemas/JobTitlePayload'
        employees:
          type: array
          items:
            $ref: '#/components/schemas/EmployeePayload'
        operatingHours:
          type: array
          items:
            $ref: '#/components/schemas/OperatingHoursPayload'
        fieldTripTypes:
          type: array
          items:
            $ref: '#/components/schemas/FieldTripTypePayload'
      required:
        - school
        - scheduleTypes
        - jobTitles
        - employees
        - operatingHours
        - fieldTripTypes
    SettingsResponse:
      type: object
      properties:
        school:
          $ref: '#/components/schemas/SchoolRecord'
          nullable: true
        scheduleTypes:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleTypeResponse'
        jobTitles:
          type: array
          items:
            $ref: '#/components/schemas/JobTitleResponse'
        employees:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeResponse'
        operatingHours:
          type: array
          items:
            $ref: '#/components/schemas/OperatingHoursResponse'
        fieldTripTypes:
          type: array
          items:
            $ref: '#/components/schemas/FieldTripTypeResponse'
      required: [school]
    SettingsSaveResponse:
      type: object
      properties:
        school:
          $ref: '#/components/schemas/SchoolRecord'
      required: [school]
    ScheduleSavePayload:
      type: object
      properties:
        scheduleWeek:
          $ref: '#/components/schemas/ScheduleWeek'
        scheduleDays:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleDay'
        segmentBlocks:
          type: array
          items:
            $ref: '#/components/schemas/SegmentBlock'
        staffAssignments:
          type: array
          items:
            $ref: '#/components/schemas/StaffAssignment'
        fieldTripEvents:
          type: array
          items:
            $ref: '#/components/schemas/FieldTripEvent'
      required: [scheduleWeek, scheduleDays, segmentBlocks, staffAssignments, fieldTripEvents]
    ScheduleWeekResponse:
      type: object
      properties:
        id:
          type: string
        schoolId:
          type: string
        label:
          type: string
        status:
          $ref: '#/components/schemas/ScheduleStatus'
        startDate:
          type: string
        scheduleDays:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleDay'
        segmentBlocks:
          type: array
          items:
            $ref: '#/components/schemas/SegmentBlock'
        staffAssignments:
          type: array
          items:
            $ref: '#/components/schemas/StaffAssignment'
        fieldTripEvents:
          type: array
          items:
            $ref: '#/components/schemas/FieldTripEvent'
      required: [id, schoolId, status, scheduleDays, segmentBlocks, staffAssignments, fieldTripEvents]
    GenericOk:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]
